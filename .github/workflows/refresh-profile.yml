name: refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render dynamic project cards
        run: python scripts/render_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed stats
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/daria.svg assets/veil.svg assets/daphne.svg assets/arkonova.svg
          if git diff --cached --quiet; then
            echo "No profile stats changed."
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          git push
